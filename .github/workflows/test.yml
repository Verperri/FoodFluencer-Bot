name: Post-creation pipeline tests

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  injector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
